version: 2

models:
  # Staging Models
  - name: stg_orders
    description: "Cleaned and standardized orders data"
    columns:
      - name: order_id
        description: "Unique identifier for each order"
        tests:
          - unique
          - not_null
      - name: customer_id
        description: "Foreign key to customers"
        tests:
          - not_null
      - name: order_date
        description: "Date when order was placed"
        tests:
          - not_null
      - name: order_amount_dollars
        description: "Order amount in dollars"
        tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: 0
              inclusive: false

  - name: stg_customers
    description: "Cleaned and standardized customer data"
    columns:
      - name: customer_id
        description: "Unique identifier for each customer"
        tests:
          - unique
          - not_null
      - name: customer_email
        description: "Customer email address"
        tests:
          - unique
          - not_null

  - name: stg_products
    description: "Cleaned and standardized product data"
    columns:
      - name: product_id
        description: "Unique identifier for each product"
        tests:
          - unique
          - not_null
      - name: price_dollars
        description: "Product price in dollars"
        tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: 0
              inclusive: false

  - name: stg_order_items
    description: "Cleaned and standardized order items data"
    columns:
      - name: order_item_id
        description: "Unique identifier for each order item"
        tests:
          - unique
          - not_null
      - name: order_id
        description: "Foreign key to orders"
        tests:
          - not_null
          - relationships:
              to: ref('stg_orders')
              field: order_id
      - name: product_id
        description: "Foreign key to products"
        tests:
          - not_null
          - relationships:
              to: ref('stg_products')
              field: product_id

  # Mart Models
  - name: dim_customers
    description: "Customer dimension with behavioral segments and metrics"
    columns:
      - name: customer_id
        description: "Unique customer identifier"
        tests:
          - unique
          - not_null
      - name: customer_segment
        description: "RFM-based customer segment"
        tests:
          - not_null
          - accepted_values:
              values: ['Champions', 'Loyal Customers', 'New Customers', 'Potential Loyalists', 'At Risk', 'Cannot Lose Them', 'Hibernating', 'Others', 'No Orders']

  - name: dim_products
    description: "Product dimension with performance metrics"
    columns:
      - name: product_id
        description: "Unique product identifier"
        tests:
          - unique
          - not_null
      - name: product_classification
        description: "Performance-based product classification"
        tests:
          - not_null
          - accepted_values:
              values: ['Star Products', 'Solid Performers', 'Declining Stars', 'New Launches', 'Underperformers', 'Average Performers', 'Never Sold']

  - name: fct_orders
    description: "Order fact table with enriched metrics"
    columns:
      - name: order_id
        description: "Unique order identifier"
        tests:
          - unique
          - not_null
      - name: customer_id
        description: "Foreign key to customers"
        tests:
          - not_null
          - relationships:
              to: ref('dim_customers')
              field: customer_id
      - name: order_amount_dollars
        description: "Order amount in dollars"
        tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: 0
              inclusive: false