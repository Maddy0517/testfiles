version: 2

sources:
  - name: raw_data
    description: "Raw data from our application database"
    database: your-gcp-project-id  # Replace with your actual project ID
    schema: raw_data  # Replace with your actual raw data dataset
    
    tables:
      - name: orders
        description: "Customer order transactions"
        columns:
          - name: order_id
            description: "Unique identifier for each order"
            tests:
              - unique
              - not_null
          - name: customer_id
            description: "Foreign key to customers table"
            tests:
              - not_null
          - name: order_date
            description: "Date when the order was placed"
            tests:
              - not_null
          - name: order_amount
            description: "Total order amount in cents"
            tests:
              - not_null
          - name: order_status
            description: "Current status of the order"
            tests:
              - accepted_values:
                  values: ['pending', 'processing', 'shipped', 'delivered', 'cancelled']
                  
      - name: customers
        description: "Customer master data"
        columns:
          - name: customer_id
            description: "Unique identifier for each customer"
            tests:
              - unique
              - not_null
          - name: customer_email
            description: "Customer email address"
            tests:
              - unique
              - not_null
          - name: first_name
            description: "Customer first name"
          - name: last_name
            description: "Customer last name"
          - name: registration_date
            description: "Date when customer registered"
          - name: customer_segment
            description: "Customer segment classification"
            
      - name: products
        description: "Product catalog data"
        columns:
          - name: product_id
            description: "Unique identifier for each product"
            tests:
              - unique
              - not_null
          - name: product_name
            description: "Name of the product"
          - name: category
            description: "Product category"
          - name: price
            description: "Product price in cents"
          - name: created_date
            description: "Date when product was added to catalog"
            
      - name: order_items
        description: "Individual items within orders"
        columns:
          - name: order_item_id
            description: "Unique identifier for each order item"
            tests:
              - unique
              - not_null
          - name: order_id
            description: "Foreign key to orders table"
            tests:
              - not_null
          - name: product_id
            description: "Foreign key to products table"
            tests:
              - not_null
          - name: quantity
            description: "Quantity of the product ordered"
            tests:
              - not_null
          - name: unit_price
            description: "Price per unit in cents"
            tests:
              - not_null