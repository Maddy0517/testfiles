# =============================================================================
# GCS to BigQuery Cloud Function Configuration
# =============================================================================
# Update these values for your environment (dev/sit/uat/prod)
# =============================================================================

# GCP Project ID
gcp.project.id=your-project-id

# GCS Bucket containing CSV files
gcs.bucket.name=your-bucket-name

# Optional: Folder prefix to scan (leave empty for root)
gcs.file.prefix=

# BigQuery Dataset ID
bigquery.dataset.id=your_dataset

# BigQuery Table ID
bigquery.table.id=file_uploads
