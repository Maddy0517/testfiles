# =============================================================================
# Application Configuration for GCS to BigQuery Cloud Function
# =============================================================================
# This file contains environment-specific configuration.
# Update these values when deploying to different environments.
#
# Environment: DEV (Change this comment when copying to other environments)
# =============================================================================

# -----------------------------------------------------------------------------
# GCP Project Configuration
# -----------------------------------------------------------------------------
# The GCP project ID where resources are located
gcp.project.id=your-project-id

# -----------------------------------------------------------------------------
# Google Cloud Storage Configuration
# -----------------------------------------------------------------------------
# The GCS bucket name containing the CSV files to process
gcs.bucket.name=your-bucket-name

# Optional: Prefix/folder path to filter files within the bucket
# Leave empty to scan all files in the bucket
# Example: uploads/pending/ or data/2024/
gcs.file.prefix=

# -----------------------------------------------------------------------------
# BigQuery Configuration
# -----------------------------------------------------------------------------
# The BigQuery dataset ID
bigquery.dataset.id=your_dataset

# The BigQuery table ID
bigquery.table.id=file_uploads
