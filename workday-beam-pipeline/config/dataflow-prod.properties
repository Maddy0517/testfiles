# =============================================================================
# Production Dataflow Configuration
# =============================================================================
# This file contains all pipeline configuration for Google Cloud Dataflow.
# Use this file path in Eclipse Run Configuration Program Arguments:
# --propertiesFile=/path/to/workday-beam-pipeline/config/dataflow-prod.properties

# =============================================================================
# BEAM RUNNER CONFIGURATION
# =============================================================================
runner=DataflowRunner

# =============================================================================
# GOOGLE CLOUD DATAFLOW CONFIGURATION
# =============================================================================
# GCP Project and Region
project=your-gcp-project-id
region=us-central1

# Job Configuration
jobName=workday-to-bigquery-workers-prod
maxNumWorkers=20
autoscalingAlgorithm=THROUGHPUT_BASED
machineType=n1-standard-4

# Storage Configuration
stagingLocation=gs://your-gcs-bucket/staging
tempLocation=gs://your-gcs-bucket/temp
gcpTempLocation=gs://your-gcs-bucket/temp

# =============================================================================
# WORKDAY CONFIGURATION
# =============================================================================
# Workday SOAP API Configuration
workdayEndpoint=https://wd2-impl-services1.workday.com
workdayUsername=your_workday_username
workdayPassword=your_workday_password
workdayTenant=your_tenant_name
workdayVersion=v41.2

# Service and Operation Configuration
serviceName=Human_Resources
operationName=Get_Workers

# Pagination Settings (larger for production)
pageSize=200
maxRetries=5

# =============================================================================
# GOOGLE CLOUD BIGQUERY CONFIGURATION
# =============================================================================
# BigQuery Configuration
bigQueryProject=your-gcp-project-id
bigQueryDataset=workday_data_prod
bigQueryTable=workers

# BigQuery Write Settings
writeDisposition=WRITE_APPEND
createDisposition=CREATE_IF_NEEDED

# =============================================================================
# TRANSFORMATION CONFIGURATION
# =============================================================================
# Transformation Type: generic, worker, organization
transformationType=worker

# =============================================================================
# JVM ARGUMENTS (for reference - set these in Eclipse VM arguments)
# =============================================================================
# -DGOOGLE_APPLICATION_CREDENTIALS=/path/to/service-account-key.json
# -Xmx4g
# -Xms1g