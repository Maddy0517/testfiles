# =============================================================================
# Generic Data Extraction Configuration
# =============================================================================
# This file contains configuration for generic data extraction from any Workday service.
# Use this file path in Eclipse Run Configuration Program Arguments:
# --propertiesFile=/path/to/workday-beam-pipeline/config/generic-data.properties

# =============================================================================
# BEAM RUNNER CONFIGURATION
# =============================================================================
runner=DirectRunner

# =============================================================================
# WORKDAY CONFIGURATION
# =============================================================================
# Workday SOAP API Configuration
workdayEndpoint=https://wd2-impl-services1.workday.com
workdayUsername=your_workday_username
workdayPassword=your_workday_password
workdayTenant=your_tenant_name
workdayVersion=v41.2

# Service and Operation Configuration - Customize for your needs
# Examples:
# - Financial_Management / Get_Cost_Centers
# - Human_Resources / Get_Job_Profiles
# - Human_Resources / Get_Locations
serviceName=Financial_Management
operationName=Get_Cost_Centers

# Pagination Settings
pageSize=100
maxRetries=3

# =============================================================================
# GOOGLE CLOUD CONFIGURATION
# =============================================================================
# BigQuery Configuration
bigQueryProject=your-gcp-project-id
bigQueryDataset=workday_data_dev
bigQueryTable=cost_centers

# BigQuery Write Settings
writeDisposition=WRITE_TRUNCATE
createDisposition=CREATE_IF_NEEDED

# =============================================================================
# TRANSFORMATION CONFIGURATION
# =============================================================================
# Generic transformation preserves all data in JSON format
transformationType=generic

# =============================================================================
# JVM ARGUMENTS (for reference - set these in Eclipse VM arguments)
# =============================================================================
# -Dorg.slf4j.simpleLogger.defaultLogLevel=INFO
# -DGOOGLE_APPLICATION_CREDENTIALS=/path/to/service-account-key.json
# -Xmx2g
# -Xms512m