# Cloud Scheduler configuration for automated pipeline runs
# Deploy this using: gcloud scheduler jobs create app-engine <job-name> --schedule="<cron>" --http-method=POST ...

# Daily Incremental Load Job
apiVersion: cloudscheduler.googleapis.com/v1
kind: Job
metadata:
  name: workday-incremental-daily
  location: us-central1
spec:
  schedule: "0 2 * * *"  # Run at 2 AM daily
  timeZone: "America/New_York"
  httpTarget:
    uri: https://dataflow.googleapis.com/v1b3/projects/${PROJECT_ID}/locations/us-central1/templates:launch
    httpMethod: POST
    headers:
      Content-Type: application/json
    body: |
      {
        "jobName": "workday-incremental-${TIMESTAMP}",
        "parameters": {
          "workdayEndpoint": "${WORKDAY_ENDPOINT}",
          "workdayUsername": "${WORKDAY_USERNAME}",
          "workdayPassword": "${WORKDAY_PASSWORD}",
          "workdayTenant": "${WORKDAY_TENANT}",
          "bigQueryDataset": "workday_data",
          "bigQueryTable": "employees",
          "loadType": "INCREMENTAL",
          "effectiveDate": "${CURRENT_DATE}",
          "lastModifiedFrom": "${YESTERDAY_DATETIME}",
          "writeDisposition": "WRITE_APPEND"
        },
        "environment": {
          "tempLocation": "gs://${PROJECT_ID}-dataflow/temp",
          "zone": "us-central1-a",
          "maxWorkers": 5,
          "numWorkers": 2,
          "workerMachineType": "n1-standard-2"
        }
      }
    oauthToken:
      serviceAccountEmail: scheduler-sa@${PROJECT_ID}.iam.gserviceaccount.com
  retryConfig:
    retryCount: 3
    minBackoffDuration: "60s"
    maxBackoffDuration: "3600s"

---

# Weekly Historical Load Job (Full Refresh)
apiVersion: cloudscheduler.googleapis.com/v1
kind: Job
metadata:
  name: workday-historical-weekly
  location: us-central1
spec:
  schedule: "0 3 * * 0"  # Run at 3 AM on Sundays
  timeZone: "America/New_York"
  httpTarget:
    uri: https://dataflow.googleapis.com/v1b3/projects/${PROJECT_ID}/locations/us-central1/templates:launch
    httpMethod: POST
    headers:
      Content-Type: application/json
    body: |
      {
        "jobName": "workday-historical-${TIMESTAMP}",
        "parameters": {
          "workdayEndpoint": "${WORKDAY_ENDPOINT}",
          "workdayUsername": "${WORKDAY_USERNAME}",
          "workdayPassword": "${WORKDAY_PASSWORD}",
          "workdayTenant": "${WORKDAY_TENANT}",
          "bigQueryDataset": "workday_data",
          "bigQueryTable": "employees_historical",
          "loadType": "HISTORICAL",
          "effectiveDate": "${CURRENT_DATE}",
          "writeDisposition": "WRITE_TRUNCATE"
        },
        "environment": {
          "tempLocation": "gs://${PROJECT_ID}-dataflow/temp",
          "zone": "us-central1-a",
          "maxWorkers": 10,
          "numWorkers": 3,
          "workerMachineType": "n1-standard-4"
        }
      }
    oauthToken:
      serviceAccountEmail: scheduler-sa@${PROJECT_ID}.iam.gserviceaccount.com
  retryConfig:
    retryCount: 2
    minBackoffDuration: "300s"
    maxBackoffDuration: "3600s"