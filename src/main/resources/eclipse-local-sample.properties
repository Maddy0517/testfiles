# Workday to BigQuery Pipeline Configuration - Eclipse Local Development
# ========================================================================
# IMPORTANT: Copy this file to eclipse-local.properties and update with your actual credentials

# Workday SOAP API Configuration
# ------------------------------
# Replace these with your actual Workday credentials:
workday.soap.url=https://YOUR-TENANT-NAME.workday.com/ccx/service/YOUR-TENANT-NAME/Human_Resources/v40.0
workday.username=YOUR-INTEGRATION-USERNAME@YOUR-TENANT-NAME
workday.password=YOUR-INTEGRATION-PASSWORD
workday.tenant=YOUR-TENANT-NAME
workday.api.version=v40.0

# Example for a tenant called "acme":
# workday.soap.url=https://acme.workday.com/ccx/service/acme/Human_Resources/v40.0
# workday.username=integration_user@acme
# workday.password=MySecurePassword123
# workday.tenant=acme

# Google Cloud BigQuery Configuration
# -----------------------------------
bigquery.project=YOUR-GCP-PROJECT-ID
bigquery.dataset=workday_data_dev
bigquery.table=workers_dev
bigquery.schema=bigquery_schema.json
bigquery.write.disposition=WRITE_TRUNCATE
bigquery.create.disposition=CREATE_IF_NEEDED

# API Configuration (small batches for local testing)
# ---------------------------------------------------
api.batch.size=5
api.max.retries=2
api.request.timeout=30000
api.enable.pagination=true
api.page.size=5

# Date Filter Configuration for Testing
# -------------------------------------
workday.effective.from.date=2024-12-01
workday.effective.to.date=2024-12-08
workday.include.effective.from.date=true
workday.include.effective.to.date=true

# Local Development Settings
# ---------------------------
runner=DirectRunner