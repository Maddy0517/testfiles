# Workday to BigQuery Pipeline Configuration

# Default Workday Configuration
workday.api.version=v35.0
workday.api.timeout.seconds=300
workday.api.batch.size=100
workday.api.max.retries=3
workday.api.retry.delay.seconds=5

# BigQuery Configuration
bigquery.write.disposition=WRITE_TRUNCATE
bigquery.create.disposition=CREATE_IF_NEEDED
bigquery.streaming.enabled=false
bigquery.batch.size=1000

# Pipeline Configuration
pipeline.num.workers=5
pipeline.max.workers=20
pipeline.machine.type=n1-standard-2
pipeline.disk.size.gb=100
pipeline.use.public.ips=true
pipeline.streaming.engine.enabled=false

# Monitoring Configuration
monitoring.metrics.enabled=true
monitoring.logging.level=INFO
monitoring.health.check.interval.seconds=60

# Error Handling Configuration
error.handling.max.errors.per.bundle=10
error.handling.dead.letter.table.enabled=true
error.handling.dead.letter.table.suffix=_errors

# Performance Configuration
performance.parallelism.factor=2
performance.memory.limit.mb=3584
performance.gc.algorithm=G1GC

# Security Configuration
security.encryption.at.rest=true
security.encryption.in.transit=true