apiVersion: batch/v1
kind: Job
metadata:
  name: workday-bigquery-pipeline
  namespace: default
  labels:
    app: workday-pipeline
    version: "1.0.0"
spec:
  ttlSecondsAfterFinished: 86400  # Clean up after 24 hours
  backoffLimit: 3
  template:
    metadata:
      labels:
        app: workday-pipeline
    spec:
      restartPolicy: Never
      serviceAccountName: workday-pipeline-sa
      containers:
      - name: pipeline
        image: gcr.io/PROJECT_ID/workday-bigquery-pipeline:latest
        imagePullPolicy: Always
        env:
        - name: PROJECT_ID
          value: "your-gcp-project-id"
        - name: REGION
          value: "us-central1"
        - name: WORKDAY_ENDPOINT
          value: "https://wd2-impl-services1.workday.com/ccx/service/tenant/Human_Resources/v35.0"
        - name: WORKDAY_USERNAME
          valueFrom:
            secretKeyRef:
              name: workday-credentials
              key: username
        - name: WORKDAY_PASSWORD
          valueFrom:
            secretKeyRef:
              name: workday-credentials
              key: password
        - name: WORKDAY_TENANT
          value: "tenant"
        - name: BQ_DATASET
          value: "workday_data"
        - name: BQ_TABLE
          value: "employees"
        - name: BATCH_SIZE
          value: "100"
        - name: MAX_WORKERS
          value: "10"
        - name: JAVA_OPTS
          value: "-Xmx3584m -Xms1024m -XX:+UseG1GC"
        resources:
          requests:
            memory: "2Gi"
            cpu: "1000m"
          limits:
            memory: "4Gi"
            cpu: "2000m"
        command:
        - "java"
        args:
        - "-jar"
        - "app.jar"
        - "--project=$(PROJECT_ID)"
        - "--region=$(REGION)"
        - "--runner=DataflowRunner"
        - "--workdayEndpoint=$(WORKDAY_ENDPOINT)"
        - "--workdayUsername=$(WORKDAY_USERNAME)"
        - "--workdayPassword=$(WORKDAY_PASSWORD)"
        - "--workdayTenant=$(WORKDAY_TENANT)"
        - "--bigQueryDataset=$(BQ_DATASET)"
        - "--bigQueryTable=$(BQ_TABLE)"
        - "--batchSize=$(BATCH_SIZE)"
        - "--maxNumWorkers=$(MAX_WORKERS)"
        - "--usePublicIps=true"
        - "--stagingLocation=gs://$(PROJECT_ID)-dataflow-staging/staging"
        - "--tempLocation=gs://$(PROJECT_ID)-dataflow-staging/temp"
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: workday-bigquery-pipeline-cron
  namespace: default
spec:
  schedule: "0 2 * * *"  # Run daily at 2 AM UTC
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 86400
      template:
        spec:
          restartPolicy: OnFailure
          serviceAccountName: workday-pipeline-sa
          containers:
          - name: pipeline
            image: gcr.io/PROJECT_ID/workday-bigquery-pipeline:latest
            env:
            - name: PROJECT_ID
              value: "your-gcp-project-id"
            - name: REGION
              value: "us-central1"
            - name: WORKDAY_ENDPOINT
              value: "https://wd2-impl-services1.workday.com/ccx/service/tenant/Human_Resources/v35.0"
            - name: WORKDAY_USERNAME
              valueFrom:
                secretKeyRef:
                  name: workday-credentials
                  key: username
            - name: WORKDAY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: workday-credentials
                  key: password
            - name: WORKDAY_TENANT
              value: "tenant"
            - name: BQ_DATASET
              value: "workday_data"
            - name: BQ_TABLE
              value: "employees"
            resources:
              requests:
                memory: "2Gi"
                cpu: "1000m"
              limits:
                memory: "4Gi"
                cpu: "2000m"