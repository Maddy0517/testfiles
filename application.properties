# Workday SOAP API Configuration
workday.soap.url=https://wd2-impl-services1.workday.com/ccx/service/YOUR-TENANT/Human_Resources/v38.0
workday.username=integration_user@tenant
workday.password=your-password
workday.tenant.id=your-tenant

# Pipeline Configuration
effective.date=2025-12-15
max.retries=3

# BigQuery Configuration
bigquery.table=your-project-id:workday_data.employees
write.disposition=WRITE_APPEND

# Dataflow Configuration (for cloud execution)
gcp.project.id=your-gcp-project-id
gcp.region=us-central1
gcs.temp.location=gs://your-bucket/temp
gcs.staging.location=gs://your-bucket/staging
num.workers=10
max.num.workers=50
worker.machine.type=n1-standard-4
